# Qual provider usar: anthropic (API, produção) | claude-code (CLI local) | fake (testes).
# A variável de ambiente LLM_PROVIDER sobrepõe este valor.
provider: anthropic

review_model: claude-opus-5-5
# Teto de tokens de saída. No Opus o thinking conta como saída: teto baixo
# trunca (stop_reason=max_tokens) e o review sai vazio.
review_max_tokens: 20000
# review_effort: medium   # low | medium | high — omitido = padrão do modelo

# Preço em USD por milhão de tokens. Custo = usage × esta tabela.
prices_usd_per_mtok:
  claude-opus-5-5:   {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5:  {input: 0.10, output: 0.50}
